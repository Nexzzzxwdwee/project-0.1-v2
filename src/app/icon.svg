<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" fill="none" role="img" aria-label="TTC">
  <defs>
    <filter id="ttcGlow" x="-25%" y="-25%" width="150%" height="150%">
      <feGaussianBlur stdDeviation="1.8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <g filter="url(#ttcGlow)" fill="#E0002B" stroke="#E0002B" stroke-linecap="square">

    <!-- Outer ring: 4° gaps at N/E/S/W -->
    <g stroke-width="5" fill="none">
      <path d="M 187.95 103.07 A 88 88 0 0 1 103.07 187.95"/>
      <path d="M 96.93 187.95 A 88 88 0 0 1 12.05 103.07"/>
      <path d="M 12.05 96.93 A 88 88 0 0 1 96.93 12.05"/>
      <path d="M 103.07 12.05 A 88 88 0 0 1 187.95 96.93"/>
    </g>

    <!-- Inner ring: 4° gaps at N/E/S/W -->
    <g stroke-width="4" fill="none">
      <path d="M 177.95 102.72 A 78 78 0 0 1 102.72 177.95"/>
      <path d="M 97.28 177.95 A 78 78 0 0 1 22.05 102.72"/>
      <path d="M 22.05 97.28 A 78 78 0 0 1 97.28 22.05"/>
      <path d="M 102.72 22.05 A 78 78 0 0 1 177.95 97.28"/>
    </g>

    <!-- Top triangle ▼ -->
    <polygon points="86,0 114,0 100,18" stroke="none"/>

    <!-- Bottom triangle ▲ -->
    <polygon points="86,200 114,200 100,182" stroke="none"/>

    <!-- TTC letterforms -->

    <!-- Left T: wide crossbar spans into the center wick, thick stem under it -->
    <rect x="26" y="50" width="84" height="14" stroke="none"/>
    <rect x="55" y="64" width="18" height="86" stroke="none"/>

    <!-- Central candlestick wick: long thin vertical extending toward both triangles -->
    <rect x="96" y="22" width="8" height="156" stroke="none"/>

    <!-- C: large thick arc opening to the right -->
    <path d="M 157 80.5 A 34 34 0 1 0 157 139.5" stroke-width="14" fill="none" stroke-linecap="butt"/>

  </g>
</svg>
