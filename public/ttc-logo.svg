<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" fill="none" role="img" aria-label="TTC">
  <defs>
    <filter id="ttcGlow" x="-25%" y="-25%" width="150%" height="150%">
      <feGaussianBlur stdDeviation="2.2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <g filter="url(#ttcGlow)" fill="#E0002B" stroke="#E0002B" stroke-linecap="square">

    <!-- Outer ring: 4 arcs with 10° gaps at N/E/S/W -->
    <g stroke-width="4.5" fill="none">
      <path d="M 185.67 107.50 A 86 86 0 0 1 107.50 185.67"/>
      <path d="M 92.50 185.67 A 86 86 0 0 1 14.33 107.50"/>
      <path d="M 14.33 92.50 A 86 86 0 0 1 92.50 14.33"/>
      <path d="M 107.50 14.33 A 86 86 0 0 1 185.67 92.50"/>
    </g>

    <!-- Inner ring: 4 arcs with 10° gaps at N/E/S/W (same gap positions) -->
    <g stroke-width="3.5" fill="none">
      <path d="M 175.71 106.62 A 76 76 0 0 1 106.62 175.71"/>
      <path d="M 93.38 175.71 A 76 76 0 0 1 24.29 106.62"/>
      <path d="M 24.29 93.38 A 76 76 0 0 1 93.38 24.29"/>
      <path d="M 106.62 24.29 A 76 76 0 0 1 175.71 93.38"/>
    </g>

    <!-- Top triangle (▼, pointing down into the ring) -->
    <polygon points="89,2 111,2 100,20" stroke="none"/>

    <!-- Bottom triangle (▲, pointing up into the ring) -->
    <polygon points="89,198 111,198 100,180" stroke="none"/>

    <!-- TTC letterforms -->
    <!-- Central candlestick wick: long vertical, extends well above and below crossbars -->
    <rect x="93" y="26" width="10" height="148" stroke="none"/>

    <!-- Shared top crossbar — spans left T into central stem -->
    <rect x="48" y="58" width="65" height="12" stroke="none"/>

    <!-- Left T stem -->
    <rect x="68" y="70" width="10" height="62" stroke="none"/>

    <!-- C — open right, drawn as a thick arc -->
    <path d="M 162 78 A 32 32 0 1 0 162 142" stroke-width="11" fill="none" stroke-linecap="butt"/>

  </g>
</svg>
